name: Release

# The single release pipeline. Previously this lived in two tag-triggered
# workflows (release.yml + desktop.yml) that BOTH published to the same tag with
# different artifact names — a race that could clobber the auto-update feed.
# Everything now flows through here: one gate, one build fan-out, one release.
#
#   Tests → verify version → build installers (win/mac/linux) + source payload
#         → checksum everything → generate notes → publish ONE GitHub Release
#
# Cut a release:
#   python scripts/version.py --set 2.1.0 && git commit -am "release 2.1.0"
#   git tag v2.1.0 && git push origin main --tags
#
# Dry run (installers as artifacts, nothing published):
#   Actions → Release → Run workflow
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [stable, beta, nightly]
        default: stable
      publish:
        description: "Publish a GitHub Release (otherwise artifacts only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  # Windows runners default to a legacy console codepage (cp1252), so any
  # non-ASCII byte a script prints raises UnicodeEncodeError and fails the job.
  # UTF-8 mode makes Python's stdio UTF-8 regardless of the console codepage —
  # the systemic guard, in addition to scripts keeping their output ASCII.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Gate — a release can never ship untested code.
  # ---------------------------------------------------------------------------
  ci:
    name: Tests
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # 2. Resolve + validate the version and channel.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify version
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # A nightly gets a unique, sortable prerelease version so the update feed
      # can distinguish builds. Stable/beta use the VERSION file as-is.
      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          channel="${{ inputs.channel || 'stable' }}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            # A tag's own prerelease component decides the channel.
            case "$tag" in
              *-beta*)    channel=beta ;;
              *-nightly*) channel=nightly ;;
              *-*)        channel=beta ;;
              *)          channel=stable ;;
            esac
            # The tag must match the committed VERSION. Rewriting VERSION here
            # instead would publish artifacts that disagree with the tagged
            # source — bump with `scripts/version.py --set` before tagging.
            committed="$(python scripts/version.py)"
            if [ "$tag" != "$committed" ]; then
              echo "::error::tag v$tag does not match VERSION $committed. Run 'python scripts/version.py --set $tag', commit, then re-tag."
              exit 1
            fi
            publish=true
          elif [ "$channel" = "nightly" ]; then
            base="$(python scripts/version.py)"
            base="${base%%-*}"
            python scripts/version.py --set "${base}-nightly.${{ github.run_number }}" >/dev/null
            publish="${{ inputs.publish || false }}"
          else
            publish="${{ inputs.publish || false }}"
          fi

          version="$(python scripts/version.py)"
          # Fails if any component drifted from VERSION (incl. desktop/package.json).
          python scripts/version.py --check

          prerelease=false
          [ "$channel" = "stable" ] || prerelease=true

          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "channel=$channel"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish=$publish"       >> "$GITHUB_OUTPUT"
          echo "::notice::version=$version channel=$channel prerelease=$prerelease publish=$publish"

      # The resolved version must reach every build job (nightly rewrites it).
      - name: Upload resolved VERSION
        uses: actions/upload-artifact@v4
        with:
          name: version-file
          path: VERSION
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Native installers. Each OS builds its own targets; nothing is published
  #    from here so exactly one job owns the Release.
  # ---------------------------------------------------------------------------
  desktop:
    name: Installers (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Pick up the version the verify job resolved, then re-sync the literals
      # that electron-builder bakes into filenames and the update feed.
      - uses: actions/download-artifact@v4
        with:
          name: version-file
      - name: Sync version
        shell: bash
        run: |
          python scripts/version.py --sync
          echo "building $(python scripts/version.py)"

      - name: Install backend + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock
          pip install pyinstaller

      # Frontend build + PyInstaller freeze + assemble desktop/resources/backend.
      # --require-frozen fails the build rather than shipping an installer that
      # would fall back to a system Python end users do not have.
      - name: Stage backend
        run: python desktop/scripts/stage-backend.py --require-frozen

      # `npm ci` (not `install`): reproducible from the committed lockfile, and it
      # fails loudly if package.json and the lock have drifted.
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build installers
        working-directory: desktop
        shell: bash
        env:
          # Signing is optional: set these repo secrets to produce signed builds.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarize only when Apple credentials are actually present.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
        run: npx electron-builder --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # *.yml carries the auto-update feeds (latest.yml / latest-mac.yml /
          # latest-linux.yml, plus per-channel files for prereleases). builder-debug
          # is electron-builder's internal dump — every OS writes one, so it would
          # collide on merge AND get attached to the public release.
          path: |
            desktop/release-build/*.exe
            desktop/release-build/*.zip
            desktop/release-build/*.dmg
            desktop/release-build/*.AppImage
            desktop/release-build/*.deb
            desktop/release-build/*.yml
            desktop/release-build/*.blockmap
            !desktop/release-build/builder-debug.yml
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. Source payload — for CLI / headless / server users who don't want a GUI.
  # ---------------------------------------------------------------------------
  payload:
    name: Source payload
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: version-file
      - run: python scripts/version.py --sync

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build payload
        run: python scripts/build_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: |
            releases/redforge-${{ needs.verify.outputs.version }}.zip
            releases/redforge-${{ needs.verify.outputs.version }}.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 5. One job owns the Release: verify the asset set, checksum, publish.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [verify, desktop, payload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Only release assets land in dist/. The version-file artifact goes to the
      # repo root instead — merging it into dist/ put a stray VERSION file into
      # SHA256SUMS.txt, so `sha256sum -c` referenced a file that is not published.
      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Collect source payload
        uses: actions/download-artifact@v4
        with:
          name: payload
          path: dist

      - name: Collect resolved VERSION
        uses: actions/download-artifact@v4
        with:
          name: version-file
          path: .

      - name: Sync version
        run: |
          python scripts/version.py --sync
          python scripts/version.py

      # Hard gate: every platform's installer AND its update feed must exist.
      # Without this a half-successful matrix could publish a release that
      # silently omits macOS, or ships installers with no auto-update file.
      - name: Verify the asset set is complete
        run: python scripts/verify_release_assets.py dist --version "${{ needs.verify.outputs.version }}"

      - name: Checksum every asset
        run: python scripts/checksums.py dist -o dist/SHA256SUMS.txt

      - name: Generate release notes
        run: |
          python scripts/release_notes.py \
            --version "${{ needs.verify.outputs.version }}" \
            --checksums dist/SHA256SUMS.txt \
            -o dist/NOTES.md

      - name: Summary
        run: |
          ls -la dist
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: needs.verify.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: RedForge v${{ needs.verify.outputs.version }}
          body_path: dist/NOTES.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            dist/RedForge-v${{ needs.verify.outputs.version }}-*.exe
            dist/RedForge-v${{ needs.verify.outputs.version }}-*.zip
            dist/RedForge-v${{ needs.verify.outputs.version }}-*.dmg
            dist/RedForge-v${{ needs.verify.outputs.version }}-*.AppImage
            dist/RedForge-v${{ needs.verify.outputs.version }}-*.deb
            dist/redforge-${{ needs.verify.outputs.version }}.zip
            dist/redforge-${{ needs.verify.outputs.version }}.tar.gz
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS.txt
