[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redforge"
# Single source of truth: the repo-root VERSION file (see docs/architecture/release-engineering.md).
dynamic = ["version"]
description = "RedForge — local AI security evaluation (CLI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# The CLI is standard-library only; end users need nothing beyond Python.
# Backend dependencies are installed separately (`redforge install`).
dependencies = []

[project.scripts]
redforge = "redforge.cli:main"

[tool.setuptools]
# The `redforge` package lives under cli/ so `pip install .` from the repo root
# installs the CLI and its `redforge` console script.
package-dir = { "" = "cli" }
packages = ["redforge"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

# ---------------------------------------------------------------------------
# Lint gate (CI: `ruff check`)
#
# Deliberately narrow. This is a *correctness* gate, not a style gate: syntax
# errors (E9), broken comparisons/f-strings (F63, F7) and undefined names (F82)
# are things that must never reach main. Style rules are intentionally NOT
# enabled — turning them on wholesale would flood CI with pre-existing findings
# and train everyone to ignore it. Widen the select list deliberately, in its
# own change, once the tree is clean for the new rules.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
extend-exclude = [
    "unsloth_compiled_cache",
    "desktop/.pyinstaller",
    "dist",
    "releases",
    "**/__pycache__",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
