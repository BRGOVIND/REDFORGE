<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(120% 120% at 50% 0%, #16161a 0%, #0b0b0d 60%);
      color: #e7e7ea; user-select: none;
    }
    .mark { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .mark span { color: #ef4444; }
    .bar { width: 240px; height: 4px; border-radius: 999px; background: #26262b; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 40%; border-radius: 999px; background: #ef4444;
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    .msg { font-size: 12px; color: #9a9aa2; min-height: 16px; text-align: center; padding: 0 24px; }
    .v { position: absolute; bottom: 12px; font-size: 10px; color: #56565e; }
  </style>
</head>
<body>
  <div class="mark">Red<span>Forge</span></div>
  <div class="bar"><i></i></div>
  <div class="msg" id="msg">Starting the local engine…</div>
  <div class="v" id="v"></div>
  <script>
    const msg = document.getElementById('msg');
    window.redforge?.onSplashStatus?.((d) => {
      if (d.message) msg.textContent = d.message;
      else if (d.log) msg.textContent = d.log.slice(0, 90);
    });
    window.redforge?.appInfo?.().then((i) => { document.getElementById('v').textContent = 'v' + (i?.version || ''); }).catch(() => {});
  </script>
</body>
</html>
