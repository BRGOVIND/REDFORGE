<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RedForge animation QA</title>
  <style>
    body { margin: 0; color: #eee; background: #151515; font: 14px monospace; }
    header { position: relative; z-index: 1; padding: 16px; background: #151515; max-width: 580px; max-height: 40vh; overflow: auto; }
    #fixture { position: fixed; left: 0; top: 0; }
    button { padding: 10px 18px; }
    pre { white-space: pre-wrap; }
    iframe { border: 0; display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Animation QA</h1>
    <p>Development-only checks against the real app. Media preferences are simulated per iframe. Frame timings measure JavaScript canvas work, not GPU presentation.</p>
    <button id="run">Run animation checks</button>
    <pre id="results">Ready</pre>
  </header>
  <div id="fixture"></div>
  <script type="module" src="./animation.js"></script>
</body>
</html>
